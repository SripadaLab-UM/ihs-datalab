name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of this on the tagged commit before it
  # publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type check
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest -q
      - name: Evaluation graders
        run: uv run ruff check ../evals && uv run ruff format --check ../evals && uv run pytest -q ../evals/test_graders.py
      - name: Spine conversion
        run: uv run ruff check ../scripts/convert-spine && uv run ruff format --check ../scripts/convert-spine && uv run pytest -q ../scripts/convert-spine
      - name: Release parity check (comparison logic)
        run: uv run ruff check ../scripts/parity && uv run ruff format --check ../scripts/parity && uv run pytest -q ../scripts/parity

  backend-windows:
    # The Windows-only failures: text in the locale's encoding (cp1252),
    # asyncio's Proactor loop, and export folders written by path (junctions).
    # Just those tests, to keep it quick.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Text encoding and shutdown tests
        run: uv run pytest -q tests/test_text_encoding.py tests/test_shutdown_noise.py
      # Export folders by path (Windows has no dir_fd): the swap and race
      # tests, and junctions (mklink /J, _winapi.CreateJunction), never followed.
      - name: Export folder tests
        run: uv run pytest -q tests/test_export_folders.py
      # The launcher's icons in <app>\icons: never through a link or junction.
      - name: Launcher icon tests
        run: uv run pytest -q tests/test_launcher_icons.py

  upgrade:
    # A data folder from the previous release (the last v* tag) upgrades with
    # this commit's code, backed up first and with every row kept, then rolls
    # back to exactly what it was. SQLite only, so it takes seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The previous release's tag and code come from git history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Upgrade from the previous release, then roll back
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check ../scripts/upgrade-rollback-test.py
          uv run ruff format --check ../scripts/upgrade-rollback-test.py
          uv run python ../scripts/upgrade-rollback-test.py

  oracle:
    # The backend against a real Oracle: the synthetic database (fake data only).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Start and load the synthetic database
        run: synthetic/db.sh generate && synthetic/db.sh verify
      - name: Integration tests
        working-directory: backend
        env:
          # Dev-only password of the synthetic database (see synthetic/README.md).
          DATALAB_ORACLE_PASSWORD: datalab_ro
        run: uv sync --locked && uv run pytest -m oracle -q
      - name: The evaluation traps still separate right from wrong
        working-directory: backend
        run: uv run python ../evals/expected.py --check
      - name: Safety check (adversarial, against the synthetic database), watching for DNS leaks
        working-directory: backend
        env:
          DATALAB_ORACLE_PASSWORD: datalab_ro
          DATALAB_PROFILE: practice
          DATALAB_DATA_DIR: ${{ runner.temp }}/datalab
          DATALAB_AGENT_IMAGE: datalab-probe:ci
          DATALAB_HOST: 0.0.0.0
        run: |
          docker build -q -t datalab-probe:ci ../images/probe
          command -v tcpdump >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q tcpdump)
          ../scripts/dns-leak-test.sh
      - name: The Safety check catches a broken sandbox
        working-directory: backend
        env:
          DATALAB_HOST: 0.0.0.0
        run: uv run pytest -m docker -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: API types match the backend
        run: sh scripts/api-types.sh && git diff --exit-code frontend/src/api/schema.d.ts
      - name: Type check, test, build
        working-directory: frontend
        run: npm run typecheck && npm test && npm run build
      - name: The release package installs cleanly and starts
        # Catches dependencies that only the development setup provides.
        run: |
          sh scripts/build-release.sh
          uv venv -q --no-config /tmp/clean --python 3.13
          # As the installers and the updater install it: every file by hash,
          # wheels only, from PyPI only.
          (cd backend/dist && uv pip install -q --no-config --require-hashes \
            --only-binary :all: --default-index https://pypi.org/simple \
            --python /tmp/clean/bin/python -r requirements.txt)
          /tmp/clean/bin/datalab --version
          /tmp/clean/bin/python -c "import datalab.app, datalab.safety, datalab.trial; from datalab.cli import _web_dist; assert _web_dist(), 'web UI missing from the package'"

  windows-installer:
    # No Windows machine runs the full install in CI (Docker Desktop), but the
    # installer must at least parse, find the package beside it when it isn't
    # given, and find requirements.txt next to a package given by its bare
    # file name.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: The installers parse (Windows PowerShell 5.1, as people run them)
        shell: powershell
        run: |
          foreach ($file in "install.ps1", "uninstall.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("installer/windows/$file", [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "${file}: $_" }; exit 1 }
          }
      - name: The file pickers' script parses, and its foreground part compiles (Windows PowerShell 5.1)
        # The script DataLab runs to show the folder and file pickers, taken
        # from picker.py as it is. The dialogs themselves can't be opened here.
        shell: powershell
        run: |
          $source = Get-Content "backend/src/datalab/sessions/picker.py" -Raw
          $start = $source.IndexOf('_WINDOWS = r"""') + '_WINDOWS = r"""'.Length
          $script = $source.Substring($start, $source.IndexOf('"""', $start) - $start)
          foreach ($kind in "files", "folder") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($script.Replace('{kind}', $kind), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "${kind}: $_" }; exit 1 }
          }
          $members = [regex]::Match($script, "(?s)-MemberDefinition @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          if (-not $members) { Write-Host "No user32 definitions found"; exit 1 }
          Add-Type -Namespace DataLabPicker -Name Front -MemberDefinition $members
          $thread = [DataLabPicker.Front]::GetCurrentThreadId()
          if (-not $thread) { exit 1 }
          Write-Host "Both pickers parse; the foreground helpers compile (thread $thread)."
      - name: Without -Package, the one package beside the installer is used (and only one)
        shell: powershell
        run: |
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('if (-not $Package) {')
          $end = $script.IndexOf('if (-not $Requirements) { Write-Host')
          $slice = $script.Substring($start, $end - $start)
          # Each case runs in a PowerShell of its own, as the lines exit on a problem.
          function Run-Case($name, [string[]]$wheels) {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $Env:RUNNER_TEMP "beside-$name")
            foreach ($wheel in $wheels) { Set-Content (Join-Path $dir $wheel) "x" }
            Set-Content (Join-Path $dir "requirements.txt") "x"
            $case = Join-Path $Env:RUNNER_TEMP "case-$name.ps1"
            Set-Content $case ("`$ScriptFolder = '$($dir.FullName)'; `$Package = ''; `$Requirements = ''`n" + $slice + "`n'PACKAGE=' + `$Package")
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $case 2>&1 | Out-String
            return @{ Code = $LASTEXITCODE; Out = $out; Dir = $dir.FullName }
          }
          $one = Run-Case "one" @("datalab-0.0.0-py3-none-any.whl")
          if ($one.Code -ne 0 -or $one.Out -notmatch [regex]::Escape("PACKAGE=" + (Join-Path $one.Dir "datalab-0.0.0-py3-none-any.whl"))) { Write-Host $one.Out; exit 1 }
          $none = Run-Case "none" @()
          if ($none.Code -ne 2 -or $none.Out -notmatch "isn't in the installer's folder") { Write-Host $none.Out; exit 1 }
          $two = Run-Case "two" @("datalab-0.0.0-py3-none-any.whl", "datalab-0.0.1-py3-none-any.whl")
          if ($two.Code -ne 2 -or $two.Out -notmatch "more than one DataLab package") { Write-Host $two.Out; exit 1 }
          Write-Host "One package: used. None, or two: refused, saying why."
          exit 0  # (not the last case's exit code)
      - name: Only package names with a version are accepted
        shell: powershell
        run: |
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('$IsUrl =')
          $marker = '$Version = $Matches[1]'
          $slice = $script.Substring($start, $script.IndexOf($marker) + $marker.Length - $start)
          $cases = @{ "datalab-0.1.0a3-py3-none-any.whl" = 0; "datalab-7-py3-none-any.whl" = 0
            "datalab-1.-py3-none-any.whl" = 2; "datalab-latest-py3-none-any.whl" = 2; "datalab-.1-py3-none-any.whl" = 2 }
          foreach ($name in $cases.Keys) {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $Env:RUNNER_TEMP ("name-" + [guid]::NewGuid()))
            Set-Content (Join-Path $dir $name) "x"; Set-Content (Join-Path $dir "requirements.txt") "x"
            $case = Join-Path $dir "case.ps1"
            Set-Content $case ("Set-Location '$($dir.FullName)'; `$Package = '$name'; `$Requirements = ''`n" + $slice + "`n'VERSION=' + `$Version")
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $case 2>&1 | Out-String
            if ($LASTEXITCODE -ne $cases[$name]) { Write-Host "$name -> exit $LASTEXITCODE`n$out"; exit 1 }
            Write-Host "$name -> exit $LASTEXITCODE"
          }
          exit 0  # (not the last case's exit code)
      - name: The pinned uv downloads, matches its SHA-256, and is signed by its publisher
        # The installer's own function, run on its own: this checks the pins
        # (and how Windows names the publisher) before anyone installs.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Say", "Good", "Stop-Install", "Remove-Tree", "Get-Organisation", "Install-PinnedUv") {
              . ([scriptblock]::Create($f.Extent.Text))
            }
          }
          foreach ($pin in "UvVersion", "UvZipUrl", "UvZipSha256", "UvPublisher") {
            $line = [regex]::Match($script, "(?m)^\`$$pin = .*$").Value
            Invoke-Expression $line
          }
          $StateDir = Join-Path $Env:RUNNER_TEMP "DataLab"
          $UvDir = Join-Path $StateDir "uv"; $Uv = Join-Path $UvDir "uv.exe"
          New-Item -ItemType Directory -Force $StateDir | Out-Null
          Install-PinnedUv
          $said = & $Uv --version
          if ($said -notmatch "^uv $([regex]::Escape($UvVersion))( |$)") { Write-Host "uv says: $said"; exit 1 }
          Install-PinnedUv  # a second run reuses it
          Write-Host "Pinned $said is fine."
      - name: A bare package file name finds requirements.txt beside it
        shell: powershell
        run: |
          $dir = New-Item -ItemType Directory -Path (Join-Path $Env:RUNNER_TEMP "pkg")
          Set-Content (Join-Path $dir "datalab-0.0.0-py3-none-any.whl") "x"
          Set-Content (Join-Path $dir "requirements.txt") "x"
          Set-Location $dir
          # Run the installer's package-resolution lines on their own.
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $start = $script.IndexOf('$IsUrl =')
          $end = $script.IndexOf('if (-not $Requirements) { Write-Host')
          $Package = "datalab-0.0.0-py3-none-any.whl"; $Requirements = ""
          Invoke-Expression $script.Substring($start, $end - $start)
          if ($Requirements -ne (Join-Path $dir "requirements.txt")) { Write-Host "Found: '$Requirements'"; exit 1 }
          Write-Host "Found $Requirements"
      - name: The installer's Docker Desktop restart ends only this account's processes, and says when it can't
        # Get-OwnPids, Stop-DockerDesktopProcesses and Stop-DockerVm as they are,
        # over a table of processes: tasklist, taskkill and wsl.exe answer as
        # they did on a Michigan Medicine laptop (2026-09-29). Nothing here ends
        # a real process. Invoke-Captured itself runs for real, on cmd.exe.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content (Join-Path $Env:GITHUB_WORKSPACE "installer/windows/install.ps1") -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            if ($f.Name -in "Invoke-Captured", "Get-OwnPids", "Stop-DockerDesktopProcesses", "Stop-DockerVm") {
              . ([scriptblock]::Create($f.Extent.Text))
            }
          }
          Invoke-Expression ([regex]::Match($script, "(?m)^\`$DockerDesktopImages = .*$").Value)
          function Fail($what) { Write-Host "FAILED: $what"; exit 1 }

          $cmd = Join-Path $Env:SystemRoot "System32\cmd.exe"
          $ran = Invoke-Captured $cmd "/c echo out& echo err 1>&2& exit 3"
          if ($ran.Code -ne 3 -or $ran.Out -notmatch "out" -or $ran.Out -notmatch "err") { Fail "Invoke-Captured: $($ran | Out-String)" }
          if ($null -ne (Invoke-Captured $cmd "/c ping -n 5 127.0.0.1 >nul" 1)) { Fail "Invoke-Captured didn't give up after its time" }

          # From here on, the programs answer from the table instead.
          $SystemDir = "C:\NotUsed"
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $script:Unkillable = @(); $script:Ending = @(); $script:Killed = @(); $script:TasklistCode = 0
          function Start-Sleep { param($Seconds) }  # the wait loop, without the waiting
          function Invoke-Captured($file, [string]$arguments, $seconds = 30) {
            $image = [regex]::Match($arguments, '/FI "IMAGENAME eq ([^"]+)"').Groups[1].Value
            $user = [regex]::Match($arguments, '/FI "USERNAME eq ([^"]+)"').Groups[1].Value
            switch (Split-Path $file -Leaf) {
              "tasklist.exe" {
                # taskkill /F answers before a process has gone: it's gone by the next listing.
                foreach ($id in $script:Ending) { $script:Table = @($script:Table | Where-Object { $_.Id -ne $id }) }
                $script:Ending = @()
                if ($script:TasklistCode -ne 0) { return @{ Code = $script:TasklistCode; Out = "ERROR: Invalid query`r`n" } }
                $rows = @($script:Table | Where-Object { $_.Image -eq $image -and $_.User -eq $user } |
                  ForEach-Object { '"{0}","{1}","Console","1","5,284 K"' -f $_.Image, $_.Id })
                if (-not $rows) { return @{ Code = 0; Out = "INFO: No tasks are running which match the specified criteria.`r`n" } }
                return @{ Code = 0; Out = ($rows -join "`r`n") + "`r`n" }
              }
              "taskkill.exe" {
                if ($arguments -notmatch '^/F /FI "IMAGENAME eq [^"]+" /FI "USERNAME eq [^"]+" /PID \d+$') { Fail "taskkill $arguments" }
                $id = [int][regex]::Match($arguments, '/PID (\d+)').Groups[1].Value
                $hit = @($script:Table | Where-Object { $_.Id -eq $id -and $_.Image -eq $image -and $_.User -eq $user })
                if (-not $hit) { return @{ Code = 0; Out = "`r`nINFO: No tasks running with the specified criteria.`r`n" } }
                $script:Killed += $id
                if ($id -notin $script:Unkillable) { $script:Ending += $id }
                return @{ Code = 0; Out = "SUCCESS: The process with PID $id has been terminated.`r`n" }
              }
              "wsl.exe" {
                if ($arguments -ne "--terminate docker-desktop") { Fail "wsl $arguments" }
                return $script:Wsl
              }
              default { Fail "ran $file" }
            }
          }
          function Set-Table {
            $script:Table = @(
              @{ Image = "Docker Desktop.exe"; Id = 31692; User = $me },
              @{ Image = "Docker Desktop.exe"; Id = 23420; User = "OTHER\someone" },  # never ended
              @{ Image = "com.docker.backend.exe"; Id = 26876; User = $me },
              @{ Image = "com.docker.backend.exe"; Id = 29752; User = $me })
            $script:Unkillable = @(); $script:Ending = @(); $script:Killed = @(); $script:TasklistCode = 0
          }

          Set-Table
          $ids = Get-OwnPids "Docker Desktop.exe"
          if ($ids.Count -ne 1 -or $ids[0] -ne 31692) { Fail "Get-OwnPids listed $($ids -join ',')" }
          $none = Get-OwnPids "docker-sandbox.exe"
          if ($null -eq $none -or $none.Count -ne 0) { Fail "no processes should be an empty list, not `$null" }
          if (-not (Stop-DockerDesktopProcesses)) { Fail "Stop-DockerDesktopProcesses said it couldn't" }
          if ((@($script:Killed | Sort-Object) -join ",") -ne "26876,29752,31692") { Fail "ended $($script:Killed -join ',')" }
          if (-not ($script:Table | Where-Object { $_.Id -eq 23420 })) { Fail "another account's process was ended" }

          Set-Table; $script:Unkillable = @(26876)
          if (Stop-DockerDesktopProcesses) { Fail "a process that stays should say so" }
          Set-Table; $script:TasklistCode = 1
          if ($null -ne (Get-OwnPids "Docker Desktop.exe")) { Fail "a failed tasklist should be `$null" }
          if (Stop-DockerDesktopProcesses) { Fail "a failed tasklist should say it couldn't" }

          $script:Wsl = @{ Code = 0; Out = "The operation completed successfully. `r`n" }
          if (-not (Stop-DockerVm)) { Fail "a terminated VM" }
          $script:Wsl = @{ Code = -1; Out = "There is no distribution with the supplied name.`r`nError code: Wsl/Service/WSL_E_DISTRO_NOT_FOUND`r`n" }
          if (-not (Stop-DockerVm)) { Fail "a VM that isn't there counts as stopped" }
          $script:Wsl = @{ Code = 1; Out = "Catastrophic failure`r`n" }
          if (Stop-DockerVm) { Fail "a failed terminate" }
          $script:Wsl = $null
          if (Stop-DockerVm) { Fail "a terminate that didn't answer" }
          Write-Host "Only this account's Docker Desktop processes end; a stuck one, a failed listing or a failed terminate says so."
          exit 0
