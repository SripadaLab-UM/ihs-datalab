name: Release

# Push a tag like v0.1.0 to publish a release:
# 0. run all of CI on the tagged commit; stop if anything fails;
# 1. build the agent image for Intel/AMD and Apple Silicon and push it to the
#    GitHub Container Registry;
# 2. build the DataLab package with that image pinned by digest inside it;
# 3. create a GitHub Release with the package, the exact dependency versions,
#    the installers, the exact images (images.json), and a SHA256SUMS file.
#
# Not done here yet, because each needs something CI doesn't have:
# - TODO(signing): Authenticode-sign install.ps1 and uninstall.ps1. Needs the
#   lab's code-signing certificate; managed Windows machines may refuse
#   unsigned scripts under their execution policy.
# - TODO(signing): sign or notarize anything macOS runs directly. Today the
#   installer writes the launcher on the user's machine, so nothing shipped
#   needs it yet; a pre-built DataLab.app would need an Apple Developer ID.
# - TODO(windows): the fresh-install and update-and-rollback run on a real
#   managed Windows machine (docs/DISTRIBUTION.md, "Windows specifics"). CI
#   only checks that the installer parses (ci.yml, windows-installer).
# - The gateway and proxy images aren't built here: they're upstream images
#   pinned by digest in sessions/containers.py, and the release lists them.
#   If DataLab builds its own gateway image later, add it to the image jobs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/sripadalab-um/datalab-agent

jobs:
  checks:
    # Everything CI checks, including the adversarial Safety check and the
    # DNS leak test, on exactly the tagged commit. Nothing is published unless
    # it all passes.
    uses: ./.github/workflows/ci.yml

  version:
    # Before anything is published: a tag that doesn't match the package
    # version would push images under the wrong name.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the package version
        # Pre-releases included: v0.1.0-alpha.2 is version 0.1.0a2 (PEP 440),
        # so each pre-release has its own version and updates can tell them apart.
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/src/datalab/__init__.py)
          tag=$(printf '%s' "${GITHUB_REF_NAME#v}" | sed -E \
            -e 's/-(alpha|a)\.?([0-9]+)$/a\2/' -e 's/-(beta|b)\.?([0-9]+)$/b\2/' -e 's/-rc\.?([0-9]+)$/rc\1/')
          test "$tag" = "$version" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }

  image:
    needs: [checks, version]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Remember the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  manifest:
    needs: image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine both platforms under the version tag
        run: |
          docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME}" \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests))
      - name: Pin the combined image by digest
        id: pin
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  package:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        env:
          AGENT_IMAGE: ${{ needs.manifest.outputs.image }}
        run: sh scripts/build-release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_IMAGE: ${{ needs.manifest.outputs.image }}
        run: |
          mkdir -p assets
          cp installer/macos/install.sh assets/install-macos.sh
          cp installer/macos/uninstall.sh assets/uninstall-macos.sh
          cp installer/windows/install.ps1 assets/install-windows.ps1
          cp installer/windows/uninstall.ps1 assets/uninstall-windows.ps1
          cp backend/dist/*.whl backend/dist/constraints.txt assets/
          # Every image this release runs, pinned by digest. The gateway and
          # research proxy are upstream images pinned in the code.
          containers=backend/src/datalab/sessions/containers.py
          gateway=$(sed -n 's/^GATEWAY_IMAGE = "\(.*\)"/\1/p' "$containers")
          proxy=$(sed -n 's/^PROXY_IMAGE = "\(.*\)"/\1/p' "$containers")
          for image in "$AGENT_IMAGE" "$gateway" "$proxy"; do
            case "$image" in *@sha256:*) ;; *) echo "Not pinned by digest: '$image'"; exit 1 ;; esac
          done
          printf '{\n  "agent": "%s",\n  "gateway": "%s",\n  "proxy": "%s"\n}\n' \
            "$AGENT_IMAGE" "$gateway" "$proxy" > assets/images.json
          (cd assets && sha256sum -- * > SHA256SUMS)
          {
            echo "Images, pinned by digest:"
            echo ""
            echo "- Agent: \`$AGENT_IMAGE\`"
            echo "- Gateway: \`$gateway\`"
            echo "- Research proxy: \`$proxy\`"
            echo ""
            echo "To check a download against SHA256SUMS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`"
            echo "on Mac, or compare \`Get-FileHash <file>\` with it on Windows."
          } > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "DataLab $GITHUB_REF_NAME" \
            --notes-file notes.md \
            assets/*
