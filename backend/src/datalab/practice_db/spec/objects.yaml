# Synthetic IHS object spec.
#
# Object names, column names and Oracle types are copied from the metadata-only
# catalog export ihs_oracle_metadata_20260926T060331Z (names/types only, no data).
# Column order follows the reference cohort (IHS_2025 where present).
#
#   create_as: table | view   A "view" is a real Oracle view over `base` that
#                             renders every TIMESTAMP WITH TIME ZONE column the
#                             spec types as VARCHAR2(26) with
#                             TO_CHAR(col, 'YYYY-MM-DD HH24:MI:SS TZH:TZM'),
#                             matching the real V* views' text timestamps.
#   drift:                    per-cohort differences: `drop` removes columns,
#                             `set` retypes a column in place or appends it.
#
# Everything generated into these objects is fake.
