# DataLab session gateway (stock nginx). Rendered per session by DataLab.
# It only routes, and holds no secrets: the model relay and the agent tools
# both run in DataLab on the host, which checks the session token.
server {
    listen 80;
    server_name gateway;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host 127.0.0.1:{port};
    proxy_set_header Connection "";

    # Model requests go to DataLab's relay, which validates them and adds the key.
    location /v1/ {
        proxy_pass http://host.docker.internal:{port}/relay/v1/;
    }
{mcp_location}
    location / {
        return 404;
    }
}
