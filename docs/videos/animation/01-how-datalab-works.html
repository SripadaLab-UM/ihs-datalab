function wire(d, { head = false } = {}) {

function mover(d, { label, color = C.ink, iconName, labelDy = -16 } = {}) {
  const route = el("path", { d, fill: "none" }, routes);
  const g = wrap(L.movers);
  const body = wrap(g);
  if (iconName) {

  } else {
    el("circle", { r: 9, fill: color }, body);

  const lab = label ? text(g, 0, 0, label, { font: "sans", size: 17, weight: 500, fill: color }) : null;
  const x = wrap(g);
  el("circle", { r: 15, fill: C.paper, stroke: C.danger, "stroke-width": 1.5 }, x);
  ICON.cross(x);
  const ok = wrap(g);
  el("circle", { r: 15, fill: C.dataSoft, stroke: C.data, "stroke-width": 1.5 }, ok);
  icon(ok, "tick", 0, 1, C.data, 0.8);
  return { g, body, lab, x, ok, route, len: 0, labelDy };
}

/** Move along the route from t0 over dur. With stop, it's refused at the end;
    with tested, the refusal then turns into a tick (the Safety check). */
function move(m, t, t0, dur, { stop = false, hold = 1.1, tested = false } = {}) {
  m.len ||= m.route.getTotalLength();
  const arrive = t0 + dur;
  const leave = stop ? arrive + hold : arrive;
  const vis = Math.min(clamp((t - t0) / 0.15), 1 - clamp((t - leave) / 0.35));
  if (vis <= 0) return void (m.g.style.display = "none");
  m.g.style.display = "";
  m.g.setAttribute("opacity", vis.toFixed(3));
  const p = m.route.getPointAtLength(ease(clamp((t - t0) / dur)) * m.len);
  m.body.setAttribute("transform", `translate(${p.x} ${p.y})`);
  if (m.lab) { m.lab.setAttribute("x", p.x + 20); m.lab.setAttribute("y", p.y + m.labelDy); }
  const xp = stop ? ramp(t, arrive, 0.25) : 0;
  const okp = stop && tested ? ramp(t, arrive + 0.6, 0.3) : 0;
  m.x.style.display = xp > 0 && okp < 1 ? "" : "none";
  m.x.setAttribute("transform", `translate(${p.x} ${p.y}) scale(${((0.5 + 0.5 * xp) * (1 - okp)).toFixed(3)})`);
  m.ok.style.display = okp > 0 ? "" : "none";
  m.ok.setAttribute("transform", `translate(${p.x} ${p.y}) scale(${okp.toFixed(3)})`);
}

  text(g, x + 16, y + 23, words, { font: "sans", size: 16, weight: 500, fill: tone });
  return g;
}

function pinned(spot, target, g) {
  const [x, y] = SPOT[spot];
  const [tx, ty] = onScreen(target);
  el("path", { d: `M${clamp(tx, x, x + WIN.w)} ${clamp(ty, y, y + WIN.h)} L${tx} ${ty}`, stroke: C.faint, "stroke-width": 1.25, "stroke-dasharray": "3 4" }, g);
  el("circle", { cx: tx, cy: ty, r: 4.5, fill: C.faint }, g);
  return [x, y];
}
function footage(spot, target, heading, items) {
  const g = wrap(overlay);
  const [x, y] = pinned(spot, target, g);
  el("rect", { x, y, width: WIN.w, height: WIN.h, rx: 4, fill: C.paper, stroke: C.faint, "stroke-width": 1.5, "stroke-dasharray": "8 6" }, g);
  text(g, x + 32, y + 46, "Footage to record", { label: true, fill: C.research });
  text(g, x + 32, y + 96, heading, { size: 36 });
  const parts = items.map((item, i) => {
    const { words, at = null, mono = false, tone = C.ink, size } = typeof item === "string" ? { words: item } : item;
    const p = wrap(g);
    text(p, x + 32, y + 150 + i * 44, words, { font: mono ? "mono" : "serif", size: size ?? (mono ? 19 : 23), fill: tone });
    return { p, at };
  });
  return { g, parts, x, y };
}

    { words: "The AI can't touch anything else on your computer", size: 18, at: S("3.6", "tries to reach the web") },
    { words: "The AI can't change or damage the research database", size: 18, at: S("3.6", "looks for keys") },
  ]),
};

// When each footage window is up: from once its subject is on the map, to
// before the next window arrives, so two are never on screen together.
const SHOWN = {
  "2.1": [start("2.1") + 0.3, end("2.1") + 0.1],
  "2.6": [S("2.6", "analysis plan", 0.2), end("2.6") + 0.1],
  "2.8": [S("2.8", "If a data session", 0.3), S("2.8", "is deleted", 0.1)],
  "3.1": [S("3.1", "saves a checkpoint"), end("3.1") + 0.1],
  "3.2": [S("3.2", "On arrival", -0.2), end("3.2") + 0.1],
  "3.3": [start("3.3") + 0.3, end("3.3") + 0.1],
  "3.4": [start("3.4") + 0.2, end("3.4") + 0.1],
  "3.5": [start("3.5") + 0.3, end("3.5") + 0.1],
  "3.6": [start("3.6") + 0.3, end("3.6") + 0.1],
};

// Chapter 4: questions with known answers, a slide of its own.
const traps = wrap(overlay);
text(traps, 960, 250, "Questions with known answers", { size: 60, anchor: "middle" });
text(traps, 960, 300, "On a synthetic database", { label: true, anchor: "middle" });
const TRAPS = [["Duplicate", "rows"], ["Screened,", "never enrolled"], ["Empty", "tables"], ["Small", "groups"], ["Who stops", "answering"]];
const cards = TRAPS.map((lines, i) => {
  const g = el("g", {}, traps);
  const face = el("g", {}, g);
  el("rect", { x: -120, y: -150, width: 240, height: 300, rx: 4, fill: C.sunken, stroke: C.ink, "stroke-width": 1.25 }, face);
  text(face, 0, 26, "?", { size: 90, anchor: "middle", fill: C.faint });
  const back = el("g", {}, g);
  el("rect", { x: -120, y: -150, width: 240, height: 300, rx: 4, fill: C.paper, stroke: C.ink, "stroke-width": 1.25 }, back);
  text(back, 0, -100, "Trap", { label: true, anchor: "middle", fill: C.research });
  lines.forEach((line, j) => text(back, 0, -8 + j * 38, line, { size: 30, anchor: "middle" }));
  const tick = el("g", {}, g);
  icon(tick, "tick", 0, 200, C.data, 2);
  return { g, face, back, tick, cx: 360 + i * 300 };
});

// The close.
const quiet = el("rect", { width: 1920, height: 1000, fill: C.paper, opacity: 0 }, overlay);
const endCard = wrap(overlay);
text(endCard, 960, 500, "One question, start to finish", { size: 60, anchor: "middle" });
text(endCard, 960, 560, "More in Help", { label: true, anchor: "middle" });

const caption = text(stage, 960, 1046, "", { font: "sans", size: 31, weight: 450, anchor: "middle" });
caption.setAttribute("stroke", C.paper);
caption.setAttribute("stroke-width", 10);
caption.setAttribute("paint-order", "stroke");
caption.setAttribute("stroke-linejoin", "round");
const fadeOut = el("rect", { width: 1920, height: 1080, fill: C.paper, opacity: 0 }, stage);

// ============================================================================
// The timeline
// ============================================================================

function frameAt(t) {
  // 1.1: what this video covers.
  show(agenda, Math.min(ramp(t, 0, 0.5), 1 - ramp(t, end("1.1") + 0.2, 0.6)), 0);
  for (const a of AGENDA) a.g.setAttribute("opacity", lerp(0.22, 1, ramp(t, a.at, 0.5)).toFixed(3));
  draw(computer.r, ramp(t, end("1.1") + 0.5, 1.1));
  show(computer.t, ramp(t, end("1.1") + 1.0));

  for (const c of chapters) show(c.g, during(t, start(c.from) - 0.4, start(c.to) - 0.7), 0);

  // 2.1: the question, in the browser.
  show(browser, ramp(t, start("2.1") - 0.3));
  const typed = clamp((t - S("2.1", "did daily steps")) / 2.2);
  typing.node.textContent = QUESTION.slice(0, Math.floor(typed * QUESTION.length));

  // 2.2: DataLab.
  draw(datalab.r, ramp(t, start("2.2") + 0.1, 1.0));
  show(datalab.t, ramp(t, start("2.2") + 0.5));
  draw(W.browser, ramp(t, S("2.2", "the page comes from"), 0.8));

  // 2.3: the sealed box.
  draw(dataBox.r, ramp(t, S("2.3", "the AI gets", -0.2), 1.0));
  show(dataBox.t, ramp(t, S("2.3", "its own sealed environment")));
  show(agent, ramp(t, S("2.3", "its own sealed environment", 0.3)));
  show(workspace, ramp(t, S("2.3", "its workspace", -0.2)));
  show(files, ramp(t, S("2.3", "the files you attach", -0.2)));
  show(filesLock, ramp(t, S("2.3", "read but not change")), 0);
  dataBox.r.setAttribute("stroke-width", lerp(1.75, 4, ramp(t, S("2.3", "no route"), 0.6)));
  move(M.escape, t, S("2.3", "no route", 0.2), 0.9, { stop: true });

  // 2.4: one door.
  show(door, ramp(t, S("2.4", "one door", -0.2)));
  draw(W.gatewayUp, ramp(t, S("2.4", "A gateway"), 1.3));
  show(busLabel, ramp(t, S("2.4", "two kinds")), 0);
  move(M.model, t, S("2.4", "calls to the AI model", -0.3), 1.7);
  move(M.data, t, S("2.4", "calls for data", -0.3), 1.7);
  move(M.other, t, S("2.4", "Everything else", -0.2), 1.0, { stop: true, hold: 1.3 });

  // 2.5: the relay and the key.
  show(relay.g, ramp(t, Math.min(S("2.5", "DataLab's relay", -0.4), start("2.5") + 0.6)));
  move(M.toRelay, t, start("2.5"), 1.5);
  relay.hl.setAttribute("opacity", during(t, S("2.5", "checks each one"), S("2.5", "and sends it on", 1.2)));
  show(gpt, ramp(t, S("2.5", "and sends it on", -0.6)));
  draw(W.toGpt, ramp(t, S("2.5", "and sends it on", -0.4), 0.6));
  move(M.withKey, t, S("2.5", "and sends it on"), 1.6);
  show(keyChip, during(t, S("2.5", "The key never enters", -0.1), end("2.5") + 0.8));
  move(M.webSearch, t, S("2.5", "like a web search", -1.0), 1.5, { stop: true, hold: 1.2 });
  move(M.fetchLink, t, S("2.5", "a link for the provider", -0.9), 1.5, { stop: true, hold: 1.6 });

  // 2.6: the plan.
  show(plan.g, ramp(t, start("2.6") + 0.3));
  move(M.planIn, t, start("2.6") + 0.6, 1.6);
  move(M.planOut, t, S("2.6", "You edit it", -0.8), 0.9);
  show(planLock, ramp(t, S("2.6", "it's frozen"), 0.4), 0);

  // 2.7: the data service.
  show(dataService.g, ramp(t, Math.min(S("2.7", "data service", -0.5), start("2.7") + 0.6)));
  move(M.toData, t, start("2.7"), 1.5);
  show(database, ramp(t, S("2.7", "The database login")));
  draw(W.toDb, ramp(t, S("2.7", "The database login"), 0.6));
  const checksGo = 1 - ramp(t, end("2.7") + 0.8, 0.4);
  ["one read-only query", "checks it before", "how long", "how much"]
    .forEach((phrase, i) => show(checks[i], Math.min(ramp(t, S("2.7", phrase, -0.15), 0.4), checksGo)));
  move(M.query, t, S("2.7", "how much it can return", 0.9), 0.8);
  const resultAt = S("2.7", "The result comes back", -0.2);
  move(M.result, t, resultAt, 2.2);
  show(log.g, ramp(t, S("2.7", "written to a log", -0.6)));
  logLines.forEach((line, i) => draw(line, ramp(t, S("2.7", "written to a log", 0.1 + i * 0.25), 0.4)));

  // 2.8: research sessions and the helper.
  const researchAt = S("2.8", "That's a research session", -0.3);
  draw(researchBox.r, ramp(t, researchAt, 1.0));
  show(researchBox.t, ramp(t, researchAt + 0.4));
  show(researchAgent, ramp(t, researchAt + 0.5));
  show(researchDoor, ramp(t, researchAt + 0.5));
  draw(W.research, ramp(t, researchAt + 0.7, 0.6));
  show(proxy, ramp(t, S("2.8", "with the internet", -0.4)));
  show(web, ramp(t, S("2.8", "with the internet", -0.2)));
  draw(W.toWeb, ramp(t, S("2.8", "with the internet"), 0.6));
  move(M.toWeb, t, S("2.8", "with the internet", 0.2), 1.4);
  move(M.noDb, t, S("2.8", "no connection to the database", -0.2), 1.3, { stop: true, hold: 1.4 });
  const helperIn = S("2.8", "The helper gets", -0.5);
  const helperNow = Math.min(ramp(t, S("2.8", "If a data session", -0.2)), 1 - ramp(t, S("2.8", "is deleted", 0.2), 0.7));
  show(helper, Math.max(helperNow, during(t, habits[1].at, start("5.2"))));
  move(M.question, t, helperIn + 0.2, 1.3);
  move(M.answer, t, S("2.8", "answers", -0.1), 1.1);

  // 3.1: work, and a checkpoint.
  show(madeFiles, ramp(t, start("3.1") + 0.3, 0.5));
  show(checkpoints.g, ramp(t, S("3.1", "saves a checkpoint", -0.8)));
  show(checkTick, ramp(t, S("3.1", "saves a checkpoint", 0.3), 0.4), 0);
  workspaceHl.setAttribute("opacity", Math.max(
    during(t, resultAt + 2.1, resultAt + 3.3, 0.3),
    during(t, start("3.1"), S("3.1", "saves a checkpoint", 1.4), 0.3)));
  checkpoints.hl.setAttribute("opacity", during(t, S("3.1", "saves a checkpoint"), end("3.1") + 0.3));

  // 3.2: the answer comes back, and its numbers are checked.
  move(M.reply, t, S("3.2", "travels back", -0.4), 2.0);
  show(matched, during(t, S("3.2", "checks every number"), end("3.2") + 0.3, 0.4));

  // 3.3: the rigor review.
  show(rigor.g, ramp(t, start("3.3") - 0.2));
  move(M.review, t, S("3.3", "a second pass", 0.6), 1.4);

  // 3.4: the SQL and the queries.
  logToBrowser.setAttribute("opacity", during(t, S("3.4", "lists every query", -0.4), end("3.4") + 0.3, 0.5));

  // 3.5: export.
  show(exportB.g, ramp(t, start("3.5") - 0.2));
  show(folder, ramp(t, start("3.5") + 0.2));
  draw(W.toFolder, ramp(t, S("3.5", "export it", -0.3), 0.7));
  move(M.exportFile, t, S("3.5", "export it"), 1.2);
  move(M.exportReport, t, S("3.5", "The whole conversation"), 1.2);

  // 3.6: the Safety check replays the refusals, and each one is tested.
  show(safety.g, ramp(t, start("3.6") - 0.2));
  const test = { stop: true, tested: true, hold: 2.2 };
  move(M.t_escape, t, S("3.6", "tries to reach the web", -0.3), 0.9, test);
  move(M.t_other, t, S("3.6", "looks for keys", -0.4), 0.9, test);
  move(M.t_noDb, t, S("3.6", "confirms the database", -0.4), 1.1, test);
  move(M.t_web, t, S("3.6", "and more", -0.6), 1.1, test);

  // 4.1: questions with known answers. The map steps aside for it.
  const aside = during(t, start("4.1") - 0.5, end("4.1") + 0.3, 0.5);
  diagram.setAttribute("opacity", (1 - aside).toFixed(3));
  show(traps, during(t, start("4.1") - 0.2, end("4.1") + 0.3, 0.5), 0);
  cards.forEach((card, i) => {
    const flip = ramp(t, S("4.1", "Each question hides a trap", -0.4 + i * 0.4), 0.6);
    const sx = Math.max(0.02, Math.abs(Math.cos(Math.PI * flip)));
    card.g.setAttribute("transform", `translate(${card.cx} 560) scale(${sx.toFixed(3)} 1)`);
    card.face.style.display = flip < 0.5 ? "" : "none";
    card.back.style.display = flip < 0.5 ? "none" : "";
    show(card.tick, ramp(t, S("4.1", "graded independently", -0.2 + i * 0.3), 0.3), 0);
  });

  // Highlights: a block lights while it's the subject.
  plan.hl.setAttribute("opacity", Math.max(during(t, S("2.6", "it's frozen"), end("2.6") + 0.4), during(t, habits[2].at, habits[3].at)));
  rigor.hl.setAttribute("opacity", Math.max(during(t, S("3.3", "a second pass", -0.3), end("3.3") + 0.3), during(t, S("5.1", "keep rigor review on"), habits[3].at)));
  log.hl.setAttribute("opacity", during(t, start("3.4"), end("3.4") + 0.3));
  exportB.hl.setAttribute("opacity", Math.max(during(t, S("3.5", "export it", -0.3), end("3.5") + 0.3)));
  safety.hl.setAttribute("opacity", during(t, S("3.6", "The Safety check", -0.2), end("3.6") + 0.3));

  // 4.1: each habit on its spot.
  for (const h of habits) show(h.g, during(t, h.at, start("5.2") - 0.2, 0.5));

  // 4.2: the close.
  quiet.setAttribute("opacity", ramp(t, start("5.2") - 0.3, 0.8).toFixed(3));
  show(endCard, ramp(t, start("5.2"), 0.8));

  for (const [shot, f] of Object.entries(F)) {
    show(f.g, during(t, ...SHOWN[shot], 0.3), 0);
    for (const part of f.parts) show(part.p, part.at === null ? 1 : ramp(t, part.at, 0.4), 5);
  }

  const c = T.captions.find((c) => t >= c.start && t < c.end + 0.15);
  caption.textContent = c ? c.text : "";
  fadeOut.setAttribute("opacity", ramp(t, T.duration - 0.7, 0.6));
}

// The footage in each window: a crop of a walkthrough's take (see lib.js clip).
const SIDE = { x: 1536, y: 47, width: 384, height: 330 };
const CLIPS = {
  "2.1": { v: "10-workspace-ask", shot: "2.1", target: "modes", at: 2.3, from: 1.5 },
  "2.6": { v: "10-workspace-ask", shot: "5.1", target: "field", at: 10.7, from: 0.7 },
  "3.1": { v: "11-workspace-answer", shot: "3.2", rect: SIDE, from: 6 },
  "3.2": { v: "11-workspace-answer", shot: "2.2", target: "popover", at: 2.6, from: 1.2 },
  "3.3": { v: "11-workspace-answer", shot: "2.1", target: "checks", at: 5.1, from: 3.5 },
  "3.4": { v: "11-workspace-answer", shot: "3.2", rect: SIDE, from: 0.8 },
  "3.5": { v: "11-workspace-answer", shot: "4.1", target: "dialog", at: 2.6, from: 1.5 },
  "3.6": { v: "14-settings", shot: "3.1", rect: { x: 704, y: 95, width: 736, height: 420 }, from: 0.8 },
};
const CLIP = {};
for (const [shot, spec] of Object.entries(CLIPS)) {
  const f = F[shot];
  CLIP[shot] = await clip(f.g, { x: f.x, y: f.y, w: WIN.w, h: WIN.h }, spec);
}

// For the renderer's audit (render.mjs --audit): each window and what it points at.
window.audit = {
  windows: Object.entries(F).map(([shot, f]) => ({ shot, g: f.g })),
  subjects: { "2.1": browser, "2.6": plan.g, "2.8": helper, "3.1": checkpoints.g, "3.2": browser,
    "3.3": rigor.g, "3.4": log.g, "3.5": exportB.g, "3.6": safety.g },
};

window.duration = T.duration;
window.seek = async (t) => {
  frameAt(t);
  await Promise.all(Object.entries(CLIP)
    .filter(([shot]) => t > SHOWN[shot][0] - 0.5 && t < SHOWN[shot][1] + 0.5)
    .map(([shot, c]) => c.seek(Math.max(0, t - SHOWN[shot][0]))));
};
await document.fonts.ready;
await window.seek(0);
window.ready = true;

if (location.search.includes("preview")) {
  document.body.classList.add("preview");
  const audio = document.getElementById("audio");
  const clock = document.getElementById("clock");
  const at = new URLSearchParams(location.search).get("t");
  if (at) audio.currentTime = +at;
  const tick = () => { frameAt(audio.currentTime); clock.textContent = audio.currentTime.toFixed(1) + " s"; requestAnimationFrame(tick); };
  tick();
}
</script>
