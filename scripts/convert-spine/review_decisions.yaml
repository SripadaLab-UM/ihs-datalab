    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L103 (steps>0, 2024); ihsDataR feature_steps_day.R#L110 and qc_steps.R#L41-44 (2025)'
  - page: qc/latest_inserteddate_dedup
    question: 1
    evidence:
      - code: ihsDataR/R/dedup.R#L14-21
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L41-43 and #L88-90 (2024); ihsDataR dedup_latest, used by every device branch (2025)'
  - page: qc/healthkit_midnight_date_assignment
    question: 1
    evidence:
      - code: ihsDataR/R/utils_dates.R#L13-28
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L70-84 (hk_step_clean date_select, 2024); ihsDataR assign_daily_date (2025)'
  - page: qc/apple_watch_source_filter
    question: 1
    evidence:
      - code: ihsDataR/R/feature_resting_heart_rate_day.R#L56
    cohorts: [2025]
    source: 'ihsDataR feature_resting_heart_rate_day.R#L56, in build_resting_heart_rate_healthkit (2025). For 2024 the filter rests only on the unseen ODBC_connect_IHS2024-25.R (question 5), so 2024 is not listed'
    limitations:
      - In ihsDataR only the resting-heart-rate branch filters on SOURCEPRODUCTTYPE.
      - For 2024 the filter was applied, if at all, when the data were exported (ODBC_connect_IHS2024-25.R, not yet seen in a repo); AggregateDailyMetrics_2024.R#L122 only reads a file named as Apple-Watch-only.
  - page: qc/garmin_sleep_validation_filter_legacy_2024
    question: 1
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L307 (VALIDATION contains FINAL) and #L325 (NAPVALIDATION AUTO or DEVICE), 2024; ihsDataR feature_sleep_2025.R#L62 and #L92, 2025'
  # Question 2: pages whose DOI now counts as evidence, but where part of the
  # rule comes only from an unpublished manuscript.
  - page: qc/sensorkit_block_aggregation
    question: 2
    hold: >-
      the block sizes (15-minute app and message blocks, 24-hour phone blocks,
      visits to the nearest 15 minutes) come from the unpublished Social
      Smartphone manuscript, not the SensorKit feasibility paper it also cites
    source: pone.0329707 names the five sensors but not their block sizes; the Social Smartphone draft's methods give them
  - page: qc/sensorkit_access_caveat
    question: 2
    hold: >-
      the limit to Apple's own phone and messages apps comes from the
      unpublished Social Smartphone manuscript; the feasibility paper supports
      the rest (iPhone only, opt-in per sensor, no public sharing)
    source: pone.0329707 (methods, data availability statement); the Social Smartphone draft's limitations
  # Question 2 and 3: limitations found while checking pages against papers.
  - page: features/daily_mood
    question: 3
    evidence:
      - schema: IHS_2026.VW_DAILY_MOOD
    cohorts: [2025, 2026]
    hold: >-
      its only schema evidence, VW_DAILY_MOOD, is in IHS_2025 and IHS_2026 only,
      and the link from this feature to that view comes from the unpublished
      Social Smartphone manuscript; MoodDriver used the same 1-10 item in the
      2018-2023 cohorts, but not from this view
    source: 'generated/schema: VW_DAILY_MOOD is in IHS_2025 and IHS_2026 only; the Spine source_anchor cites it only under the Social Smartphone Manuscript'
    limitations:
      - MoodDriver (2018 to 2023 cohorts) used the same single 1-10 daily mood item, but the Spine doesn't say where those years' answers are in Oracle.
  - page: qc/rhr_plausible
    question: 8
    limitations:
      - ihsDataR doesn't apply the >100 bpm filter (R/feature_resting_heart_rate_day.R); whether it should is still open.
  - page: qc/mood_summary_min_observations
    question: 3
    hold: >-
      the Spine's text said a summary with too few observations is left
      missing, but the paper assigned the training data's median; the text is
      corrected to the paper, and a person should confirm the corrected rule
    source: 10.1017/S0033291722003014, methods (the ML models' handling of sparse summaries)
  - page: qc/active_minutes_plausible
    question: 2
    limitations:
      - ihsDataR (R/qc_active_minutes.R) only warns when a day exceeds 720 minutes; it doesn't set the value missing.
  - page: qc/steps_plausible_range
    question: 2
    limitations:
      - ihsDataR (R/qc_steps.R) only warns above 30000 steps; it doesn't set the value missing.
  - page: qc/nightshift_sleep_exclusion
    question: 2
    limitations:
      - In MoodDriver a night-shift schedule set the quarterly bedtime and wake-time minimum and maximum to missing; the paper doesn't say how night shifts were detected.
  - page: features/social_jet_lag_week
    question: 3
    limitations:
      - The paper computed it for the weeks before and after the 2019 daylight-saving change, not every week of the year.

# The answers, for REVIEW.md. `changes` there is computed by the converter.
answers:
  - question: 1
    answer: >-
      Confirmed [2024, 2025] on the reviewed feature and QC pages that have
      code or a checked legacy script: the 2024 legacy script covers 2024 and
      ihsDataR (the 2025 build) covers 2025. garmin_sleep_validation_filter_legacy_2024
      goes from [2025] to [2024, 2025]; qc/apple_watch_source_filter lists
      [2025] only, since for 2024 it rests on the unseen ODBC script. The four features and one QC rule whose
      only evidence is the unseen ODBC script lose their review (question 5),
      so their cohorts stay unconfirmed.
    evidence: AggregateDailyMetrics_2024.R lines cited per page in review_decisions.yaml; ihsDataR at ihs-pipelines@d25b712
  - question: 2
    answer: >-
      MoodDriver is the medRxiv preprint 10.64898/2026.03.03.26347299, verified;
      its methods match the rules the Spine cites it for, so those pages get
      `paper` evidence, with a note that it's the lab's own preprint, not yet
      peer reviewed (the user accepted it on 2026-09-27). The Social Smartphone manuscript and Sleep & Step ETT
      aren't published or preprinted, and no lab code computes their features,
      so pages that cite only them stay drafts. Two SensorKit rules stay drafts
      because part of each comes only from the unpublished manuscript.
    evidence: doi.org handle API and https://pubmed.ncbi.nlm.nih.gov/41822700/; PubMed, medRxiv and web searches for the other two (2026-09-27)
  - question: 3
    answer: >-
      Each paper's cohorts are now recorded, from its methods, and a page whose
      only evidence of method is a paper lists the cohorts that paper analysed.
      Paper pages get the title, cohorts and a short summary, and stay drafts.
      An independent check corrected three pages: daily_mood (its view is only
      in 2025 and 2026, and the link to it is unpublished) and
      mood_summary_min_observations (the paper imputes the training median)
      stay drafts, and osm_pgs names the right GWAS.
    evidence: the `papers` list in review_decisions.yaml (section of each paper's methods)
  - question: 4
    answer: >-
      Yes. Every r/ihsDataR code path is now ihs-pipelines@d25b712 ihsDataR/...,
      checked to exist there; the trees are identical. The one prototype-app
      path (oracle_broker.py) stays pinned to um-gpt-local-proxy. Pages that
      name runners since removed from ihsDataR say so in a limitation.
    evidence: ihs-pipelines-staging REVIEW.md; git rev-parse of both trees (52cdc23); prototype commit um-gpt-local-proxy@b154606
  - question: 5
    answer: >-
      Not yet: reference/ doesn't exist in ihs-pipelines. The names are right.
      AggregateDailyMetrics_2024.R exists (srijan-knowledge-graph/scripts/, in
      no repo) and its cited sections were checked. ODBC_connect_IHS2024-25.R
      is only an email attachment and wasn't opened, so it no longer counts as
      a page's only evidence of how something is computed.
    evidence: docs/WORKFLOWS.md "Lab pipelines repo"; ihs-pipelines-staging REVIEW.md "Not in it yet"
  - question: 6
    answer: >-
      Yes, as a DataLab proposal after install, but not as they stand. The
      survey PHQ-9 item-prefix mapping is useful once checked against
      IHS_2025.STG_SURVEYDICTIONARY; the construct's export example (a row
