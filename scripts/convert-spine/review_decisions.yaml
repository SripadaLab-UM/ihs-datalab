# The reviewer's decisions on the Spine conversion (REVIEW.md, "Questions for
# the reviewer"), applied by convert_spine.py on top of the Spine at
# SPINE_COMMIT. Every item says where its evidence is: a file and line, a
# commit, a URL or a DOI. The converter checks what it can (the text it
# replaces is there, the code paths exist at the pinned commit, the names said
# to be gone are gone) and stops if anything here no longer fits the sources.
#
# Rules: an overlay item can add evidence, cohorts, limitations or text fixes,
# and can hold a page as a draft; it can't mark a page reviewed. A page is
# reviewed only when its evidence meets the rules in docs/KNOWLEDGE_BASE.md.
# No participant data here: no counts from live queries, no values.

reviewer: ataxali
decided_on: 2026-09-27

# Questions 2 and 3: the papers the Spine cites, by DOI or by name, and the
# cohorts each analysed (a cohort is the year its interns started internship,
# as the papers use it: "the 2012-2013 academic year (the 2012 cohort)").
# Every DOI was resolved at the DOI registry's handle API
# (https://doi.org/api/handles/<doi>, responseCode 1) on 2026-09-27; cohorts
# are from each paper's methods, in the PDFs in srijan-knowledge-graph/papers/.
papers:
  - doi: 10.64898/2026.03.03.26347299
    names: [MoodDriver]
    label: MoodDriver
    title: Personalized Insights Derived from Wearable Device Data and Large Language Models to Improve Well-Being
    venue: medRxiv (preprint, not peer reviewed)
    year: 2026
    preprint: true
    cohorts: [2018, 2019, 2020, 2021, 2022, 2023]
    cohorts_from: 'Methods, "Participants": interns starting internship in 2018-2023, all with Fitbit devices'
    verified: [https://doi.org/10.64898/2026.03.03.26347299, https://pubmed.ncbi.nlm.nih.gov/41822700/]
    summary: >-
      Individual-level correlations between six Fitbit features (active minutes,
      steps, resting heart rate, bedtime, wake time, sleep duration) and daily
      mood, and MoodDriver, a system that turns them into personalized feedback
      written by a language model. Its methods give the outlier thresholds,
      regular-sleep window, active-minutes harmonization and data-sufficiency
      rules the Spine cites.
  - doi: 10.1038/s41598-021-94459-z
    title: Genomic heterogeneity affects the response to Daylight Saving Time
    venue: Scientific Reports
    year: 2021
    cohorts: [2018]
    cohorts_from: Methods, "Participants" (interns entering residency in 2018; genotyped 2018-cohort subjects)
    verified: [https://doi.org/10.1038/s41598-021-94459-z, https://pubmed.ncbi.nlm.nih.gov/34285349/]
    summary: >-
      Fitbit sleep around the 2019 daylight-saving change, split by a polygenic
      score for sleep midpoint: evening-type interns adjusted more slowly and
      showed more social jet lag afterwards.
  - doi: 10.1371/journal.pone.0260620
    title: Prediction of Suicidal Ideation Risk in a Prospective Cohort Study of Medical Interns
    venue: PLOS ONE
    year: 2021
    cohorts: [2012, 2013, 2014, 2015]
    cohorts_from: Methods (2012-2014 cohorts for training, 2015 for testing)
    verified: [https://doi.org/10.1371/journal.pone.0260620, https://pubmed.ncbi.nlm.nih.gov/34855821/]
    summary: >-
      A model of suicidal ideation during internship (PHQ-9 item 9) from
      baseline survey factors, trained on earlier cohorts and tested on a later one.
  - doi: 10.1007/s11606-020-05664-x
    title: Substantial Overlap Between Factors Predicting Symptoms of Depression and Burnout Among Medical Interns
    venue: Journal of General Internal Medicine
    year: 2020
    cohorts: [2017]
    cohorts_from: Methods (training physicians starting internship in 2017)
    verified: [https://doi.org/10.1007/s11606-020-05664-x, https://pubmed.ncbi.nlm.nih.gov/32026254/]
    summary: >-
      Personal and workplace predictors of PHQ-9 depressive symptoms and of the
      two abbreviated Maslach burnout subscales largely coincide.
  - doi: 10.1038/s41746-021-00400-z
    title: Day-to-day variability in sleep parameters and depression risk
    venue: npj Digital Medicine
    year: 2021
    cohorts: [2017, 2018]
    cohorts_from: Methods (subjects starting residency in 2017 and 2018)
    verified: [https://doi.org/10.1038/s41746-021-00400-z, https://pubmed.ncbi.nlm.nih.gov/33603132/]
    summary: >-
      Night-to-night variability in Fitbit sleep, more than average sleep, was
      associated with depressive symptoms and next-day mood.
  - doi: 10.1038/s41598-022-12066-y
    title: Prevalence and risk factors for depression among training physicians in China and the United States
    venue: Scientific Reports
    year: 2022
    cohorts: [2016, 2017, 2018]
    cohorts_from: Methods (three US cohorts enrolled 2016-2018, assessed in parallel with Chinese residents)
    verified: [https://doi.org/10.1038/s41598-022-12066-y, https://pubmed.ncbi.nlm.nih.gov/35581251/]
    summary: >-
      Depressive symptoms during the first year of residency, and their risk
      factors, compared between Chinese and US trainees.
  - doi: 10.1017/S0033291722003014
    title: Using machine learning with intensive longitudinal data to predict depression and suicidal ideation among medical interns over time
    venue: Psychological Medicine
    year: 2022
    cohorts: [2020]
    cohorts_from: 'Methods, "Participants" (interns enrolled in the 2020-2021 academic year)'
    verified: [https://doi.org/10.1017/S0033291722003014, https://pubmed.ncbi.nlm.nih.gov/36177889/]
    summary: >-
      How early in the first quarter daily mood and Fitbit summaries predict
      end-of-quarter depression and suicidal ideation; simple models on mood
      alone did best.
  - doi: 10.1371/journal.pone.0277350
    title: A caveat to using wearable sensor data for COVID-19 detection
    venue: PLOS ONE
    year: 2022
    cohorts: [2019, 2020]
    cohorts_from: Methods (participants drawn from the 2019 and 2020 cohorts)
    verified: [https://doi.org/10.1371/journal.pone.0277350, https://pubmed.ncbi.nlm.nih.gov/36584148/]
    summary: >-
      Wearable step, sleep and resting-heart-rate change metrics around symptom
      onset separated COVID-19 cases from controls less well in interns than in
      earlier reports.
  - doi: 10.1371/journal.pone.0329707
    title: Feasibility and acceptability of collecting passive phone usage and sensor data via Apple SensorKit
    venue: PLOS ONE
    year: 2025
    cohorts: [2023]
    cohorts_from: Methods, "Study design" (incoming interns for the 2023-2024 academic year)
    verified: [https://doi.org/10.1371/journal.pone.0329707, https://pubmed.ncbi.nlm.nih.gov/40802659/]
    summary: >-
      Opt-in and retention for five Apple SensorKit sensors in one cohort of
      iPhone users; opt-in was lower among interns from groups underrepresented
      in medicine.
  - doi: 10.1038/s41746-022-00746-y
    title: Effectiveness of gamified team competition as mHealth intervention for medical interns
    venue: npj Digital Medicine
    year: 2023
    cohorts: [2020]
    cohorts_from: Results, "Study cohort" (interns who began internship in July 2020)
    verified: [https://doi.org/10.1038/s41746-022-00746-y, https://pubmed.ncbi.nlm.nih.gov/36631665/]
    summary: >-
      A micro-randomized trial of weekly team step and sleep competitions in the
      first twelve weeks of internship.

