      Nothing changes in this conversion.
    evidence: git diff SPINE_COMMIT -- spine/registry (fields only)
  - question: 7
    answer: >-
      Yes. Dropped from garmin, and the stale sentence cut from participant;
      both pages' only holds were these, so they are now reviewed.
    evidence: generated/schema IHS_2025/VGARMINACTIVITYSUMMARY.yml and VW_IHS_PARTICIPANT_SUMMARY.yml (type VIEW)
  - question: 8
