  # ihsDataR implements the rule.
  - page: features/active_minutes_day
    question: 1
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L180-262 reads the 2024-cohort exports and keeps dates in [2024-04-01, 2025-07-01); ihsDataR build_active_minutes_day is the 2025 build (IHS_2025 by default, R/data_sources.R#L79)'
  - page: features/steps_day
    question: 1
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L100-103 (2024 cohort window); ihsDataR build_steps_day with the 2025 window (inst/routines/export_steps_day.R)'
  - page: features/resting_heart_rate_day
    question: 1
    cohorts: [2024, 2025]
    source: 'AggregateDailyMetrics_2024.R#L108-179 (2024 cohort, Fitbit, Garmin and Apple Watch); ihsDataR build_resting_heart_rate_day is the 2025 build'
    limitations:
      - "ihsDataR's code doesn't apply the >100 bpm exclusion (qc/rhr_plausible, from MoodDriver) or decode HEALTHKITSAMPLEKEY (qc/healthkit_hexkey_decode); neither does AggregateDailyMetrics_2024.R."
  - page: features/resting_heart_rate_day
