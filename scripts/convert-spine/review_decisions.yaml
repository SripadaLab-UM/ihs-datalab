# Per-entry changes to the Spine's text, applied before conversion.
entries:
  - entry: canonical_features/resting_heart_rate_day
    question: 8
    replace:
      - field: description
        old: '; the current recipe models only the Apple Watch branch (Fitbit/Garmin pending port).'
        new: ', and the recipe and ihsDataR port all three branches.'
      - field: description
        old: 'one value per participant-day.'
        new: 'one value per participant-day per device.'
      - field: granularity
        old: participant-day
        new: participant-day-device
    release_hold: true
    source: >-
      Prototype commit um-gpt-local-proxy@04e5c2b ("Add combined daily resting heart rate
      runner", 2026-07-14) added the Fitbit and Garmin branches to the recipe
      and r/ihsDataR/R/feature_resting_heart_rate_day.R, but left the
      description written on 2026-07-09 (um-gpt-local-proxy@a1490b4).
  - entry: feature_recipes/resting_heart_rate_day_v1
    question: 8
    set:
      implemented_in: r/ihsDataR/R/feature_resting_heart_rate_day.R
    replace:
      - field: aggregation_window
        old: participant-day
        new: participant-day-device
    source: >-
      ihsDataR/R/feature_resting_heart_rate_day.R (#L87-101,
      build_resting_heart_rate_day) combines the three branches exactly as the
      recipe's cleaning rules say; added in um-gpt-local-proxy@04e5c2b with its runner and tests.
  - entry: canonical_features/osm_pgs
    question: 3
    replace:
      - field: description
        old: UK Biobank chronotype GWAS
        new: UK Biobank accelerometer-based sleep-midpoint GWAS
    source: 'DST genomics paper (10.1038/s41598-021-94459-z), methods: OSM-PGS was computed with PRSice from the GWAS of accelerometer-based sleep midpoint in UK Biobank'
  - entry: qc_rules/mood_summary_min_observations
    question: 3
    replace:
      - field: condition
        old: otherwise the summary is omitted.
        new: with fewer, the paper assigned the training data's median value of that statistic.
      - field: on_fail
        old: set_missing
        new: impute_training_median
    source: 'ML intensive longitudinal paper (10.1017/S0033291722003014), methods: summaries needed at least two observations (means) or three (standard deviations); otherwise the training data median was assigned'
  - entry: data_sources/garmin
    question: 7
    replace:
      - field: known_limitations[0]
        old: 'The mounted Oracle catalog is table-only and may omit live Garmin views. For activity-summary work, verify IHS_2025.VGARMINACTIVITYSUMMARY with a zero-row broker query before assuming it is unavailable or substituting another object.'
        new: ''
    release_hold: true
    source: generated/schema (export 2026-09-26) has 61 IHS_2025 views, including IHS_2025.VGARMINACTIVITYSUMMARY.
  - entry: data_sources/participant
    question: 7
    replace:
      - field: known_limitations[0]
        old: ' Note the table-only catalog metadata export does not list views, so the offline catalog/search will not surface it — confirm via a live broker query.'
        new: ''
    release_hold: true
    source: generated/schema (export 2026-09-26) has IHS_2025.VW_IHS_PARTICIPANT_SUMMARY (a view, with STUDY_PARTICIPANT_ID).
  - entry: raw_variables/garmin_activity_summary_start_time_epoch_seconds
    question: 9
    exclude: >-
      it describes the same column as the validated
      garmin_activity_summary_start_time_seconds (IHS_2025.VGARMINACTIVITYSUMMARY.STARTTIMEINSECONDS),
      whose legacy_behavior already gives the same start and end derivation
    source: registry/proposed.seed.yaml at SPINE_COMMIT, both entries

