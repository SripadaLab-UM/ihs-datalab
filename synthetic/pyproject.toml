[project]
name = "ihs-synthetic"
version = "0.1.0"
description = "Synthetic (fake) IHS Oracle database for DataLab development, CI and practice mode"
requires-python = ">=3.13"
dependencies = [
    "oracledb>=3.0",
    "pyyaml>=6.0",
    # Windows has no time zone database of its own: zoneinfo falls back to this.
    "tzdata>=2025.2",
]

[tool.uv]
package = false
